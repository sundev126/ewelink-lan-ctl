services:
  ewelink-lan-ctl:
    build: .
    image: ewelink-lan-ctl:local
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      EWELINK_LISTEN_ADDR: ":33998"
      EWELINK_STATE_FILE: /data/state.json
    ports:
      - "33998:33998"
    volumes:
      - ewelink-data:/data

volumes:
  ewelink-data:
