name: 发布版本

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

jobs:
  release:
    name: 构建并发布
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "0"

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: 运行测试
        run: go test ./...

      - name: 构建发布包
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME}"
          mkdir -p dist/linux-amd64 dist/windows-amd64

          GOOS=linux GOARCH=amd64 go build \
            -trimpath -ldflags="-s -w" \
            -o dist/linux-amd64/ewelink-lan-ctl \
            ./cmd/ewelink-lan-ctl
          GOOS=windows GOARCH=amd64 go build \
            -trimpath -ldflags="-s -w" \
            -o dist/windows-amd64/ewelink-lan-ctl.exe \
            ./cmd/ewelink-lan-ctl

          tar -C dist/linux-amd64 -czf \
            "dist/ewelink-lan-ctl_${version}_linux_amd64.tar.gz" \
            ewelink-lan-ctl
          (cd dist/windows-amd64 && zip -q \
            "../ewelink-lan-ctl_${version}_windows_amd64.zip" \
            ewelink-lan-ctl.exe)
          rm -rf dist/linux-amd64 dist/windows-amd64
          (cd dist && sha256sum ./* > checksums.txt)

      - name: 生成容器镜像名称
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: 登录 GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 生成容器镜像元数据
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: 构建并推送容器镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 创建 GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/* \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
